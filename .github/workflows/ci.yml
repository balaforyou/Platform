name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# F-193 Batch 2 — the pipeline this repo's standing rules already assume exists.
#
#   checks       — lint, typecheck, register:check, diagram:verify   (fast, no services)
#   regression   — the 5 service regression suites against an ephemeral Postgres
#   integration  — build + bring up the REAL shipped stack (the production Dockerfiles),
#                  verify-deployment.mjs all-7-PASS, then the Playwright e2e suite
#
# `regression` and `integration` both `needs: checks`, so a cheap failure never spends
# Docker-build minutes, and neither heavy job starts if the checks are red.
#
# All three jobs start from `./.github/actions/setup`, which installs deps AND does the
# Prisma-generate + shared-package builds that `pnpm install` alone does not — `tsc` and
# the tsx-loaded e2e seed script need them to resolve `@badminton/*` imports.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm register:check
      - run: pnpm diagram:verify

  regression:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badminton_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d badminton_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # ./.github/actions/setup already did `cp .env.ci .env` + prisma:generate.
      - name: Migrate the test database
        run: pnpm --filter @badminton/database run prisma:deploy

      - name: Regression suites (5 services)
        run: pnpm test:regression

  integration:
    # needs regression too (not just checks) so the Docker Hub push below is gated on
    # the whole pipeline — a regression failure must stop an in-flight integration run
    # from pushing.
    needs: [checks, regression]
    runs-on: ubuntu-latest
    # Serialise main-push runs (they push to Docker Hub; a movable :<svc> tag must not be
    # raced). PR runs never push, so give them a per-ref group and let a newer push cancel
    # an older one for fast feedback.
    concurrency:
      group: dockerhub-publish-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Compute deploy SHA
        run: echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Provide deploy/gcp-vm/.env
        run: cp deploy/gcp-vm/.env.ci deploy/gcp-vm/.env

      - name: Build and start the shipped stack
        run: |
          docker compose \
            -f deploy/gcp-vm/docker-compose.yml \
            -f docker-compose.gcp-verify.yml \
            --env-file deploy/gcp-vm/.env \
            up -d --build

      - name: Wait for every component verify-deployment checks
        run: |
          # caddy depends_on the services with `condition: service_started`, not
          # `service_healthy` — so there is a window where caddy answers but a backend
          # isn't listening yet (502). Poll ALL 7 endpoints verify-deployment.mjs hits,
          # not just slot-engine, or that step races the stack coming up (main run #169).
          endpoints="
            /api/slot-engine/health
            /api/identity/health
            /api/tenant/health
            /api/payment/health
            /api/notification/health
            /version.json
            /admin/version.json
          "
          for i in $(seq 1 60); do
            all_ok=1
            for ep in $endpoints; do
              curl -fsS --max-time 5 "http://localhost:8080${ep}" >/dev/null || { all_ok=0; break; }
            done
            if [ "$all_ok" = 1 ]; then echo "all 7 components up after ~$((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "::error::stack did not fully come up within 5 minutes (last failing endpoint: ${ep})"
          docker compose -f deploy/gcp-vm/docker-compose.yml -f docker-compose.gcp-verify.yml ps
          docker compose -f deploy/gcp-vm/docker-compose.yml -f docker-compose.gcp-verify.yml logs
          exit 1

      - name: Verify deployment — all 7 components at the built SHA
        run: node scripts/verify-deployment.mjs http://localhost:8080 "$GIT_SHA"

      # F-193 Batch 3 — push the images that were JUST verified, no rebuild. The bytes
      # tagged here are the exact container images verify-deployment.mjs approved above.
      # Guarded to push-to-main only: build + verify still run on PRs, but Docker Hub
      # credentials are never exercised there. Both tag forms, all 7 components, every run
      # (F-193 decision 1) — unchanged layers dedup on Docker Hub for free.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push all 7 images (movable + immutable)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/badminton-platform
        run: |
          for svc in slot-engine identity-auth tenant-management payment notification caddy migrate; do
            docker tag "gcp-vm-$svc" "$REPO:$svc"
            docker tag "gcp-vm-$svc" "$REPO:$svc-$GIT_SHA"
            docker push "$REPO:$svc"
            docker push "$REPO:$svc-$GIT_SHA"
          done

      - name: Provision and migrate badminton_db_e2e
        run: |
          docker compose -f deploy/gcp-vm/docker-compose.yml -f docker-compose.gcp-verify.yml \
            exec -T postgres psql -U badminton -d badminton_db -c "CREATE DATABASE badminton_db_e2e;"
          DATABASE_URL="postgresql://badminton:ci-postgres-password@localhost:5432/badminton_db_e2e?schema=public" \
            pnpm --filter @badminton/database exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm --filter @badminton/guest-member-pwa exec playwright install --with-deps chromium

      # NON-BLOCKING BY DESIGN. apps/guest-member-pwa/CLAUDE.md documents this suite as
      # pre-existing 4 passed / 4 failed / 1 skipped — missing-fixture / test-code debt,
      # deliberately kept out of the findings register — and time-of-day flaky. The hard
      # e2e-level gate is the "Verify deployment" step above, which is deterministic. Do
      # NOT flip this to blocking without first clearing that fixture debt.
      - name: e2e suite (non-blocking)
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          # --retries=0: this step is non-blocking, so paying playwright.config.ts's
          # CI default of 2 retries on the known-failing specs (apps/guest-member-pwa/
          # CLAUDE.md) just triples the wall-clock for no signal.
          DATABASE_URL="postgresql://badminton:ci-postgres-password@localhost:5432/badminton_db_e2e?schema=public" \
            pnpm --filter @badminton/guest-member-pwa exec playwright test --retries=0 --reporter=list,html \
            | tee e2e-output.txt

      - name: e2e summary line
        if: always()
        run: |
          counts=$(grep -oiE '[0-9]+ (passed|failed|skipped|flaky|did not run)' e2e-output.txt \
            | paste -sd' / ' - || true)
          [ -n "$counts" ] || counts="(no counts parsed — check the e2e step log)"
          echo "**e2e:** $counts" >> "$GITHUB_STEP_SUMMARY"
          echo "_baseline 4 passed / 4 failed / 1 skipped — non-blocking, see apps/guest-member-pwa/CLAUDE.md_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/guest-member-pwa/playwright-report/
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: |
          docker compose -f deploy/gcp-vm/docker-compose.yml -f docker-compose.gcp-verify.yml \
            --env-file deploy/gcp-vm/.env down -v
